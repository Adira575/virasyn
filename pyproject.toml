[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "virasyn"
version = "0.4.0"
description = "Viral research discovery and analysis platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.36,<2",
  "biopython>=1.83,<2",
  "pandas>=2.2,<4",
  "py3Dmol>=2.5,<3",
  "requests>=2.31,<3",
  "openpyxl>=3.1,<4",
  "scipy>=1.11,<2",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["virasyn*"]

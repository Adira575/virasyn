[server]
# Avoid Streamlit's hot-reload module race on Community Cloud.
# GitHub deployments restart the app with the new code.
fileWatcherType = "none"
headless = true
maxUploadSize = 100

[theme]
base = "light"
primaryColor = "#087f8c"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#142536"
